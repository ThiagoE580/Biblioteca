<!DOCTYPE html>
<html lang="en">
<head>

    <title>Libreria</title>

        <style>
        h1{

<body>

    <main>
        <section id="agregar">
            <h1>Biblioteca San Francisco</h1>
            <h2>Agregar Libros</h2>
            <form action="">
                <label for="">Nombre del libro</label>
                <input type="text" id="nombre"> <br>
                <label for="">Autor</label> 
                <input type="text" id="autor"><br>
                <label for="">Genero</label> 
                <input type="text" id="genero"><br>
                <input type="button" onclick= agregarLibro() value="Agregar Libro">
            </form>
            <h2>Información de los libros</h2>
            <p id="mostrar_libros"></p>
        </section>
        <section id="reservar">
            <h1>Reservar Libro</h1>
            <form action="">
                <label for="">Nombre del libro</label>
                <input type="text" id="nombrelib"> <br>
                <label for="">Tu nombre</label>
                <input type="text" id="nombrepersona"> <br>
                <input type="button" onclick= reservarLibro() value="Reservar">
            </form>
            <h2>Información retiro</h2>
            <p id="mostrarreserva"></p>
        </section>
        <section id="devolver">
            <h1>Devolver Libro</h1>
            <form action="">
                <label for="">Nombre del libro</label>
                <input type="text" id="nombreld"> <br>
                <label for="">Tu nombre</label>
                <input type="text" id="nombrepd"> <br>
                <input type="button" onclick= devolverLibro() value="Devolver">
            </form>
            <h2>Información devolución</h2>
            <p id="mostrardevolucion"></p>
        </section>
    </main>
    
    <footer>
        Libreria Regional San Fco. &copy; 2025
    </footer>
</body>
</html>
